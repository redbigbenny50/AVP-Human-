# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to the expandProps map in buildSrc/src/main/groovy/multiloader-common.gradle.
#
# ⚠ CONVERTED FROM blib-gradle. The plugin used to supply everything from "Plugins" down to "Mod options"
# implicitly; buildSrc has no such defaults, so all of it is declared here. Values are taken from AVP-Alien
# (both modules target 1.21.1 with the same toolchain) except the identity block at the bottom, which is
# avp_human's own and came out of the old `blib { mod { ... } }` DSL.
# Gradle
org.gradle.daemon                    = true
org.gradle.jvmargs                   = -Xmx4G
org.gradle.parallel                  = true
org.gradle.caching                   = true
# Plugins
modmuss50_mod_publish_version        = 2.1.1
spongepowered_mixin_version          = 0.7-SNAPSHOT
fabric_loom_version                  = 1.14-SNAPSHOT
parchment_minecraft                  = 1.21.1
parchment_version                    = 2024.11.17
neoform_version                      = 1.21.1-20240808.144430
# Project
# ⚠ From the old blib { mod { publish { ... } } } block. projectSlug is the CurseForge URL slug.
modrinthID                           = t2hZvxHn
curseforgeID                         = 1406348
projectSlug                          = avp-human
# Common
java_version                         = 21
minecraft_version                    = 1.21.1
# NeoForge
loader_version_range                 = [3,)
mapping_channel                      = official
mapping_version                      = 1.21.1
minecraft_version_range              = [1.21.1, 1.21.2)
neo_moddev                           = 2.0.141
neo_version                          = 21.1.224
neo_version_range                    = [21,)
# Fabric
fabric_version                       = 0.116.6+1.21.1
fabric_loader_version                = 0.17.3
# Libs
modmenu_version                      = 11.0.0
azurelib_version                     = 3.1.3
architectury_version                 = 13.0.8
cloth_version                        = 15.0.140
gigeresque_modrinth_version          = QXyrUz2p
gigeresque_version                   = 0.8.16
avp_alien_version                    = 0.2.0-fork
avp_predator_version                 = 0.1.3-fork
blib_engine_version                  = 0.0.1-alpha.92
blib_version                         = 0.3.0-fork
just_codec_version                   = 0.1.0
just_core_version                    = 0.1.0
just_goap_version                    = 0.4.0
# ⚠ recipeViewer = 'rei' in the old DSL pulled REI in for you. buildSrc does not, so the three viewers are
# declared explicitly like AVP-Alien does. REI is the one actually wired; emi/jei are compileOnly on neoforge.
emi_version                          = 1.1.22+1.21.1
rei_version                          = 16.0.799
jei_version                          = 19.21.1.248
# Mod options
group                                = com.avp.human
mod_name                             = AVP (Human)
mod_author                           = Stargazer Studios
mod_id                               = avp_human
mod_license                          = All Rights Reserved
mod_description                      = A module for the AVP universe that adds human content.
mod_credits                          = Stargazer Studios
mod_logo                             = assets/avp_human/icon.png
mod_url                              = https://www.curseforge.com/minecraft/mc-mods/avp-human
mod_issues                           = TBD
mod_sources                          = TBD
version                              = 0.1.7-fork
# ⚠⚠ EXCLUSIVE UPPER BOUNDS for the dependency ranges in neoforge.mods.toml, e.g.
# "[${blib_version},${blib_excl_end_version})". The blib-gradle plugin supplied these implicitly; buildSrc does
# not, and processResources fails with "Missing property" without them.
# ⚠ EACH MUST BE A HIGHER BASE VERSION THAN ITS LOWER BOUND. If an upper bound equals its lower bound's base
# version you get a DEGENERATE range, and NeoForge rejects the whole jar with "not a valid mod file" and no
# useful message - exactly the avp_alien [0.2.0-fork,0.2.0) failure. Maven sorts an unknown qualifier like
# "-fork" ABOVE the plain release, so 0.2.0-fork > 0.2.0 and the range is empty.
blib_excl_end_version                = 0.4.0
avp_alien_excl_end_version           = 0.3.0
avp_predator_excl_end_version        = 0.2.0
gigeresque_excl_end_version          = 0.9.0
