// Converted from the blib-gradle plugin to buildSrc, matching AVP-Alien.
//
// ⚠ The `blib { mod { ... } }` DSL that used to live here is GONE. Everything it declared — id, name, author,
// description, license, icon, group, version — is now in gradle.properties, because that is where the buildSrc
// convention scripts read from and where processResources expands from.
//
// ⚠ PUBLISHING MOVED, IT DID NOT DISAPPEAR. The CurseForge/Modrinth/Discord block the plugin owned is now the
// `me.modmuss50.mod-publish-plugin` block in fabric/build.gradle and neoforge/build.gradle, gated on key.properties
// exactly as AVP-Alien gates it. The Discord webhook has no equivalent in that plugin — see the note in fabric.
plugins {
    // Required for NeoGradle
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.4.1"
    id 'com.diffplug.spotless' version "8.8.0" apply(false)
}

allprojects {
    repositories {
        mavenLocal()
        maven {
            name = "avpReleases"
            url = uri("https://maven.aliensvspredatormod.com/releases")
        }
    }

    // ⚠ KEEP THIS. Several published AVP/BLib POMs name BLib versions that were never uploaded, so a transitive
    // resolve picks a version that does not exist and the build dies with a confusing "could not find" on a module
    // nobody asked for directly. Pinning every com.blib:blib-* to the one in gradle.properties is what makes the
    // dependency graph resolvable at all. It came across from the blib-gradle setup unchanged.
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.blib' && details.requested.name.startsWith('blib-')) {
                details.useVersion rootProject.blib_version
                details.because 'Some published AVP/BLib POMs point at missing BLib versions.'
            }
        }
    }
}
