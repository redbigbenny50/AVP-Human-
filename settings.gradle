// Converted from the blib-gradle plugin to buildSrc, matching AVP-Alien.
//
// WHAT WENT: `includeBuild 'blib-gradle'` and `id 'blib-multiloader-settings'`. The plugin used to supply the
// pluginManagement repositories, the mod metadata and every Minecraft/loader/toolchain version implicitly; all of
// that is now explicit here, in buildSrc/, and in gradle.properties.
pluginManagement {
	repositories {
		gradlePluginPortal()
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Sponge Snapshots'
			url = 'https://repo.spongepowered.org/repository/maven-public/'
		}
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'AVP-Human'
include 'common'
include 'fabric'
include 'neoforge'
