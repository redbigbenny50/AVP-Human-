modLoader     = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license       = "${mod_license}"
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/"
[[mods]]
# The file is relative to the output directory of the resources, or the root path inside the jar when compiled
# The 'resources' directory represents the root output directory of the resources.
#enumExtensions= "META-INF/enum.extensions.json"
modId         = "${mod_id}"
version       = "${mod_version}"
displayName   = "${mod_name}"
#updateJSONURL="https://change.me.example.invalid/updates.json"
#displayURL   ="https://change.me.to.your.mods.homepage.example.invalid/"
logoFile      = "${mod_icon}"
credits       = "${mod_credits}"
authors       = "${mod_author}"
description   = '''${mod_description}'''
[[mixins]]
config        = "${mod_id}.mixins.json"
[[mixins]]
config        = "${mod_id}.neoforge.mixins.json"
# Create Aeronautics ships (Sable): applied only when Sable is installed - see SableMixinPlugin.
[[mixins]]
config        = "${mod_id}.neoforge.sable.mixins.json"
[[dependencies.${mod_id}]]
modId         = "neoforge"
type          = "required"
versionRange  = "[${neoforge_version},)"
ordering      = "NONE"
side          = "BOTH"
[[dependencies.${mod_id}]]
modId         = "minecraft"
type          = "required"
versionRange  = "${minecraft_version_range}"
ordering      = "NONE"
side          = "BOTH"
[[dependencies.${mod_id}]]
modId         = "blib"
type          = "required"
versionRange  = "[${blib_version},${blib_excl_end_version})"
ordering      = "NONE"
side          = "BOTH"
[[dependencies.${mod_id}]]
modId         = "avp_alien"
type          = "optional"
versionRange  = "[${avp_alien_version},${avp_alien_excl_end_version})"
side          = "BOTH"
[[dependencies.${mod_id}]]
modId         = "avp_predator"
type          = "optional"
versionRange  = "[${avp_predator_version},${avp_predator_excl_end_version})"
side          = "BOTH"
[[dependencies.${mod_id}]]
modId         = "create"
type          = "optional"
versionRange  = "[6.0.0,)"
ordering      = "AFTER"
side          = "BOTH"
[[dependencies.${mod_id}]]
modId         = "gigeresque"
type          = "optional"
versionRange  = "[${gigeresque_version},${gigeresque_excl_end_version})"
side          = "BOTH"

# Features are specific properties of the game environment, that you may want to declare you require. This example declares
# that your mod requires GL version 3.2 or higher. Other features will be added. They are side aware so declaring this won't
# stop your mod loading on the server for example.
#[features.${mod_id}]
#openGLVersion="[3.2,)"