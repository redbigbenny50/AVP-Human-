plugins {
    id 'com.diffplug.spotless'
    id 'java-library'
    id 'maven-publish'
    id 'idea'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenLocal()
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups("org.spongepowered") }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup "curse.maven"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url "https://maven.terraformersmc.com/releases" } // modmenu
    // ⚠⚠ REI'S OWN MAVEN. The blib-gradle plugin supplied this implicitly; AVP-Alien's convention script does not,
    // because Alien only needs the REI jar itself and picks that up from architectury's mirror. avp_human ALSO needs
    // me.shedaniel.cloth:basic-math (me.shedaniel.math.Rectangle, used by HumanREIClient), which architectury does
    // NOT mirror - this is the only place it is published. Without this repo the REI api resolves and the math
    // library does not, which reads as "package me.shedaniel.math does not exist" and nothing else.
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me'
    }
    maven { url 'https://maven.azuredoom.com/mods' }
    maven {
        name = 'Parchment'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = "avpReleases"
        url = uri("https://maven.aliensvspredatormod.com/releases")
    }
    maven { url = "https://maven.architectury.dev/" }
}

dependencies {
    implementation 'org.jetbrains:annotations:24.1.0'
}

tasks.withType(org.gradle.api.tasks.AbstractCopyTask).configureEach {
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
}

['apiElements', 'runtimeElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    def expandProps = [
            "version": version,
            "group": project.group,
            "minecraft_version": minecraft_version,
            "minecraft_version_range": minecraft_version_range,
            "fabric_version": fabric_version,
            "fabric_loader_version": fabric_loader_version,
            "mod_name": mod_name,
            "mod_author": mod_author,
            "mod_id": mod_id,
            "mod_logo": mod_logo,
            "mod_license": mod_license,
            "mod_description": mod_description,
            "mod_issues": mod_issues,
            "mod_sources": mod_sources,
            "mod_url": mod_url,
            "loader_version_range": loader_version_range,
            "neo_version": neo_version,
            "neo_version_range": neo_version_range,
            "mod_credits": mod_credits,
            "java_version": java_version,
            "azurelib_version": azurelib_version,
            "blib_version": blib_version,
            "avp_alien_version": avp_alien_version,
            "avp_predator_version": avp_predator_version,
            "gigeresque_version": gigeresque_version,
            "blib_engine_version": blib_engine_version,
            "just_codec_version": just_codec_version,
            "just_core_version": just_core_version,
            "just_goap_version": just_goap_version,
            // ⭐⭐ ALIASES FOR THE NAMES avp_human's RESOURCE TEMPLATES ALREADY USE. The blib-gradle plugin
            // supplied these; AVP-Alien's convention script never needed them because Alien's templates use the
            // names above. Rather than rewrite fabric.mod.json / neoforge.mods.toml / the mixin configs, the map
            // answers to BOTH spellings - fewer files touched, and the templates stay diffable against upstream.
            // ⚠ THE FULL SET, extracted by grepping every ${...} in every template at once. Adding them one at a
            // time does not work: processResources stops at the FIRST missing key per file, so each build only ever
            // reveals one more.
            "mod_version": version,
            "mod_icon": mod_logo,
            "neoforge_version": neo_version,
            "neoforge_loader_version_range": loader_version_range,
            // ⚠ The *_excl_end_version values are the EXCLUSIVE UPPER BOUNDS of the dependency ranges in
            // neoforge.mods.toml, e.g. "[${blib_version},${blib_excl_end_version})". They must be a HIGHER base
            // version than their lower bound or the range is degenerate and NeoForge rejects the whole jar with
            // "not a valid mod file" - see the 0.2.0-fork/0.2.0 incident.
            "blib_excl_end_version": blib_excl_end_version,
            "avp_alien_excl_end_version": avp_alien_excl_end_version,
            "avp_predator_excl_end_version": avp_predator_excl_end_version,
            "gigeresque_excl_end_version": gigeresque_excl_end_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

publishing {
    repositories {
        maven {
            name = project.mod_id
            url = "https://maven.aliensvspredatormod.com/releases"

            credentials(PasswordCredentials) {
                username = findProperty("avpMavenUsername")
                password = findProperty("avpMavenPassword")
            }

            authentication {
                basic(BasicAuthentication)
            }
        }
    }
    publications {
        maven(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
            pom.withXml {
                asNode().dependencies.dependency.each { dep ->
                    if (dep.groupId.text() == 'com.terraformersmc' && dep.artifactId.text() == 'modmenu') {
                        dep.parent().remove(dep)
                    }
                }
            }
        }
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

spotless {
    java {
        eclipse().configFile("$rootDir/eclipse-formatter.xml")
        endWithNewline()
        importOrder("", "java", group.toString(), "\\#")
        leadingTabsToSpaces(4)
        removeUnusedImports()
        trimTrailingWhitespace()
    }
}

tasks.build {
    dependsOn("spotlessApply")
}

tasks.named('compileJava', JavaCompile) {
    dependsOn("spotlessApply")
}
